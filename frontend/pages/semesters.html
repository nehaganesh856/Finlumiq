<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semesters — Finlumiq</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/common.js"></script>
<script src="/js/nav.js"></script>
<style>
.sem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.sem-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:box-shadow var(--transition),transform var(--transition);position:relative;overflow:hidden;}
.sem-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.sem-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px;}
.sem-title{font-weight:800;font-size:1rem;}
.sem-year{font-size:0.8rem;color:var(--muted);}
.sem-dates{font-size:0.82rem;color:var(--muted);margin-bottom:12px;}
.sem-budget-row{display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:6px;}
.sem-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="appNav"></div>
<header class="topbar">
  <a class="topbar-brand" href="/pages/dashboard.html"><div class="topbar-logo">🎓</div><span class="topbar-title">Finlumiq</span></a>
  <div class="topbar-right">
    <span class="topbar-page-title">Semesters</span>
    <button class="theme-toggle-btn">🌙</button>
    <button id="navOpenBtn" class="nav-open-btn">☰</button>
  </div>
</header>

<main class="page-wrap">
  <div class="page-header">
    <div class="page-header-left"><h1>📅 Semester Management</h1><p>Track your academic semesters and budgets.</p></div>
    <button class="btn btn-primary" id="addSemBtn">+ Add Semester</button>
  </div>

  <div class="tabs-bar mb-24">
    <button class="tab-btn active" data-status="">All</button>
    <button class="tab-btn" data-status="Upcoming">Upcoming</button>
    <button class="tab-btn" data-status="Active">Active</button>
    <button class="tab-btn" data-status="Completed">Completed</button>
  </div>

  <div class="sem-grid" id="semGrid">
    <div class="loading-state" style="grid-column:1/-1;"><div class="spinner"></div><span>Loading…</span></div>
  </div>
</main>

<!-- Add/Edit Modal -->
<div id="semModal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header"><span class="modal-title" id="semModalTitle">Add Semester</span><button class="modal-close" id="semModalClose">✕</button></div>
    <div class="modal-body">
      <form id="semForm" novalidate>
        <input type="hidden" id="semId">
        <div class="form-grid form-grid-2" style="gap:14px;">
          <div class="form-group"><label class="form-label">Semester Name *</label><input id="semName" type="text" class="form-control" placeholder="e.g. Semester 3" required></div>
          <div class="form-group"><label class="form-label">Semester Number *</label><input id="semNum" type="number" class="form-control" min="1" max="20" placeholder="3" required></div>
          <div class="form-group"><label class="form-label">Academic Year *</label><input id="semYear" type="text" class="form-control" placeholder="e.g. 2024-25" required></div>
          <div class="form-group"><label class="form-label">Status</label>
            <select id="semStatus" class="form-control"><option>Upcoming</option><option>Active</option><option>Completed</option></select>
          </div>
          <div class="form-group"><label class="form-label">Start Date *</label><input id="semStart" type="date" class="form-control" required></div>
          <div class="form-group"><label class="form-label">End Date *</label><input id="semEnd" type="date" class="form-control" required></div>
          <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Semester Budget (₹)</label><input id="semBudget" type="number" class="form-control" placeholder="0.00" min="0"></div>
          <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Description</label><textarea id="semDesc" class="form-control" rows="2" placeholder="Optional notes…"></textarea></div>
        </div>
        <div id="semErr" class="auth-message error mt-8" hidden></div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="semCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="semSaveBtn">Save</button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal"><div class="modal-body" style="text-align:center;padding:32px 24px;"><div style="font-size:3rem;margin-bottom:16px;">⚠️</div><div id="confirmTitle" style="font-weight:700;margin-bottom:8px;font-size:1.1rem;"></div><div id="confirmBody" style="color:var(--muted);"></div></div>
  <div class="modal-footer"><button id="confirmNo" class="btn btn-secondary">Cancel</button><button id="confirmYes" class="btn btn-danger">Delete</button></div></div>
</div>

<script src="js/common.js"></script>
<script src="js/nav.js"></script>
<script>
initTheme();
let semesters=[], activeStatusFilter='';

async function init(){
  const user=await requireAuth(); buildNav('semesters',user);
  loadSemesters();
}

async function loadSemesters(){
  try{
    semesters=await API_CLIENT.get('/semesters');
    renderGrid();
  }catch(e){showToast(e.message,'error');}
}

function renderGrid(){
  const data=activeStatusFilter?semesters.filter(s=>s.status===activeStatusFilter):semesters;
  const grid=document.getElementById('semGrid');
  if(!data.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">📅</div><h3>No semesters</h3><p>Add your first semester to start tracking!</p><button class="btn btn-primary" onclick="document.getElementById('addSemBtn').click()">Add Semester</button></div>`;
    return;
  }
  grid.innerHTML=data.map(s=>{
    const statusBadge={Upcoming:'badge-muted',Active:'badge-success',Completed:'badge-info'}[s.status]||'badge-muted';
    const days=daysUntil(s.end_date);
    return `<div class="sem-card">
      <div class="sem-card-top">
        <div>
          <div class="sem-title">${escapeHtml(s.semester_name)}</div>
          <div class="sem-year">Semester ${s.semester_number} · ${escapeHtml(s.academic_year)}</div>
        </div>
        <span class="badge ${statusBadge}">${s.status}</span>
      </div>
      <div class="sem-dates">📅 ${formatDate(s.start_date)} → ${formatDate(s.end_date)}
        ${s.status==='Active'&&days>=0?`<span class="text-primary"> (${days} days left)</span>`:''}
      </div>
      ${s.budget>0?`
        <div class="sem-budget-row"><span class="text-muted">Budget</span><strong>${money(s.budget)}</strong></div>
        <div class="progress-track" style="margin-bottom:4px;"><div class="progress-fill info" style="width:0%" id="pbar_${s.id}"></div></div>`:''}
      ${s.description?`<div class="text-muted" style="font-size:0.8rem;margin-top:8px;">${escapeHtml(s.description)}</div>`:''}
      <div class="sem-actions">
        <a href="semesters-overview.html?id=${s.id}" class="btn btn-sm btn-primary">📊 Overview</a>
        <button class="btn btn-sm btn-secondary" onclick="openEdit(${s.id})">✏️ Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteSem(${s.id},'${escapeHtml(s.semester_name)}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function openAdd(){
  document.getElementById('semModalTitle').textContent='Add Semester';
  document.getElementById('semId').value='';
  document.getElementById('semForm').reset();
  document.getElementById('semErr').hidden=true;
  document.getElementById('semModal').classList.add('active');
}
function openEdit(id){
  const s=semesters.find(x=>x.id===id); if(!s) return;
  document.getElementById('semModalTitle').textContent='Edit Semester';
  document.getElementById('semId').value=id;
  document.getElementById('semName').value=s.semester_name;
  document.getElementById('semNum').value=s.semester_number;
  document.getElementById('semYear').value=s.academic_year;
  document.getElementById('semStatus').value=s.status;
  document.getElementById('semStart').value=s.start_date;
  document.getElementById('semEnd').value=s.end_date;
  document.getElementById('semBudget').value=s.budget||'';
  document.getElementById('semDesc').value=s.description||'';
  document.getElementById('semErr').hidden=true;
  document.getElementById('semModal').classList.add('active');
}
function closeModal(){document.getElementById('semModal').classList.remove('active');}
document.getElementById('addSemBtn').addEventListener('click',openAdd);
document.getElementById('semModalClose').addEventListener('click',closeModal);
document.getElementById('semCancelBtn').addEventListener('click',closeModal);

document.getElementById('semSaveBtn').addEventListener('click',async()=>{
  const id=document.getElementById('semId').value;
  const payload={
    semester_name:document.getElementById('semName').value.trim(),
    semester_number:parseInt(document.getElementById('semNum').value),
    academic_year:document.getElementById('semYear').value.trim(),
    status:document.getElementById('semStatus').value,
    start_date:document.getElementById('semStart').value,
    end_date:document.getElementById('semEnd').value,
    budget:parseFloat(document.getElementById('semBudget').value)||0,
    description:document.getElementById('semDesc').value.trim()
  };
  const errEl=document.getElementById('semErr');
  if(!payload.semester_name||!payload.academic_year||!payload.start_date||!payload.end_date){errEl.textContent='Please fill all required fields.';errEl.hidden=false;return;}
  const btn=document.getElementById('semSaveBtn');btn.disabled=true;btn.textContent='Saving…';
  try{
    if(id) await API_CLIENT.put('/semesters/'+id,payload);
    else    await API_CLIENT.post('/semesters',payload);
    showToast(id?'Semester updated!':'Semester added!','success');
    closeModal(); loadSemesters();
  }catch(e){errEl.textContent=e.message;errEl.hidden=false;}
  finally{btn.disabled=false;btn.textContent='Save';}
});

async function deleteSem(id,name){
  const ok=await confirm2('Delete semester "'+name+'"? All associated data will be unlinked.','Delete Semester');
  if(!ok)return;
  try{await API_CLIENT.del('/semesters/'+id);showToast('Deleted.','success');loadSemesters();}
  catch(e){showToast(e.message,'error');}
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeStatusFilter=btn.dataset.status;
    renderGrid();
  });
});

init();
</script>
</body>
</html>
