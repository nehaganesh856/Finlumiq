<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reminders — Finlumiq</title><link rel="stylesheet" href="/css/app.css">
<style>
  /* Page-specific layout; colors, typography and controls inherit from css/app.css. */
  .p5-reminder-grid{display:grid;grid-template-columns:minmax(280px,350px) minmax(0,1fr);gap:20px;align-items:start}
  .p5-stack{display:grid;gap:16px;min-width:0}
  .p5-field{display:grid;gap:7px;min-width:0}
  .p5-field label{font-weight:600;font-size:.86rem;color:var(--text)}
  .p5-field input,.p5-field select,.p5-field textarea{box-sizing:border-box;width:100%;min-width:0;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:inherit;transition:border-color .18s,box-shadow .18s}
  .p5-field input:focus,.p5-field select:focus,.p5-field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .p5-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .p5-card{padding:15px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);transition:box-shadow .18s,border-color .18s}
  .p5-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
  .p5-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-width:0}
  .p5-muted{color:var(--muted);font-size:.84rem;line-height:1.5}
  .p5-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .p5-list{display:grid;gap:10px;min-width:0}
  .p5-overdue{border-left:4px solid var(--danger);background:var(--danger-soft)}
  .p5-done{opacity:.72}
  .p5-badge{display:inline-flex;align-items:center;white-space:nowrap;font-size:.74rem;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--primary-soft);color:var(--primary)}
  .p5-empty{padding:24px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius-lg);color:var(--muted);background:var(--surface)}
  @media(max-width:900px){.p5-reminder-grid{grid-template-columns:1fr}}
  @media(max-width:560px){.p5-row{grid-template-columns:1fr}.p5-card-top{gap:8px}}
</style></head>
<body><div id="appNav"></div><header class="topbar"><a class="topbar-brand" href="/pages/dashboard.html"><div class="topbar-logo">🎓</div><span class="topbar-title">Finlumiq</span></a><div class="topbar-right"><span class="topbar-page-title">My Reminders</span><button class="theme-toggle-btn">🌙</button><button id="navOpenBtn" class="nav-open-btn">☰</button></div></header>
<main class="page-wrap"><div class="page-header"><div class="page-header-left"><h1>🔔 My Reminders</h1><p>Manage your deadlines, recurring tasks and notifications.</p></div></div>
<div id="pageError" class="auth-message error" hidden></div><div class="p5-reminder-grid">
<section class="card"><div class="section-title" id="formHeading">＋ Create reminder</div><form id="reminderForm" class="p5-stack">
<div class="p5-field"><label for="rTitle">Title</label><input id="rTitle" maxlength="150" placeholder="e.g. Pay exam fee" required></div>
<div class="p5-field"><label for="rDescription">Description</label><textarea id="rDescription" rows="3" placeholder="Add details (optional)"></textarea></div>
<div class="p5-row"><div class="p5-field"><label for="rCategory">Category</label><select id="rCategory"><option>Personal</option><option>College Fees</option><option>Scholarship</option><option>Savings Goal</option><option>Budget Alert</option><option>Daily Expense</option><option>Recurring Expense</option><option>Group Settlement</option><option>Other</option></select></div><div class="p5-field"><label for="rPriority">Priority</label><select id="rPriority"><option>Low</option><option selected>Medium</option><option>High</option></select></div></div>
<div class="p5-row"><div class="p5-field"><label for="rDate">Due date</label><input id="rDate" type="date" required></div><div class="p5-field"><label for="rTime">Due time (optional)</label><input id="rTime" type="time"></div></div>
<div class="p5-field"><label for="rRepeat">Repeat</label><select id="rRepeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
<div class="p5-row"><button type="submit" class="btn btn-primary" id="saveReminderBtn">Save reminder</button><button type="button" class="btn btn-secondary" id="cancelEditBtn" hidden>Cancel edit</button></div>
</form></section>
<div class="p5-stack">
<section class="card"><div class="section-title">Financial alerts</div><div id="financialAlerts" class="p5-list"><div class="loading-state">Loading…</div></div></section>
<section class="card"><div class="section-title">My reminders <span class="p5-muted" id="pendingCount"></span></div><div id="pendingReminders" class="p5-list"></div></section>
<section class="card"><div class="section-title">Completed reminders</div><div id="completedReminders" class="p5-list"></div></section>
<section class="card"><div class="section-title">Notifications <span class="p5-muted" id="unreadCount"></span></div><div class="p5-actions" style="margin-bottom:10px"><button id="readAllBtn" class="btn btn-sm btn-secondary">Mark all read</button></div><div id="notificationsList" class="p5-list"></div></section>
</div></div></main>
<script src="/js/common.js"></script><script src="/js/nav.js"></script><script>
initTheme();let editingId=null;const $=id=>document.getElementById(id);const esc=s=>escapeHtml(s==null?'':String(s));
function err(message){$('pageError').textContent=message;$('pageError').hidden=false;}function clearErr(){$('pageError').hidden=true;}
async function init(){try{const user=await requireAuth();buildNav('phase5-reminders',user);$('rDate').value=todayISO();await refreshAll();}catch(e){err(e.message);}}
async function refreshAll(){clearErr();try{const [pending,completed,notes,alerts]=await Promise.all([API_CLIENT.get('/user-reminders?status=pending'),API_CLIENT.get('/user-reminders?status=completed'),API_CLIENT.get('/notifications'),API_CLIENT.get('/reminders')]);renderReminders(pending,completed);renderNotifications(notes);renderAlerts(alerts);}catch(e){err(e.message);}}
function reminderCard(r,done){const overdue=r.is_overdue?'p5-overdue':'';return `<article class="p5-card ${done?'p5-done':''} ${overdue}"><div class="p5-card-top"><div><strong>${esc(r.title)}</strong><div class="p5-muted">${esc(r.category)} · Due ${formatDate(r.due_date)}${r.due_time?' at '+esc(r.due_time.slice(0,5)):''}</div></div><span class="p5-badge">${esc(r.priority)}</span></div>${r.description?`<p class="p5-muted" style="margin-top:7px">${esc(r.description)}</p>`:''}<div class="p5-muted" style="margin-top:6px">${r.repeat_frequency==='none'?'One-time':`Repeats ${esc(r.repeat_frequency)}`} · Completed ${r.completed_count||0} time(s)</div><div class="p5-actions">${done?'':`<button class="btn btn-sm btn-primary" data-action="complete" data-id="${r.id}">Complete</button>`}<button class="btn btn-sm btn-secondary" data-action="edit" data-id="${r.id}">Edit</button><button class="btn btn-sm btn-danger" data-action="delete" data-id="${r.id}">Delete</button></div></article>`;}
function renderReminders(pending,completed){$('pendingCount').textContent=`(${pending.length})`;$('pendingReminders').innerHTML=pending.length?pending.map(r=>reminderCard(r,false)).join(''):'<div class="p5-empty">No pending reminders. You are all caught up.</div>';$('completedReminders').innerHTML=completed.length?completed.map(r=>reminderCard(r,true)).join(''):'<div class="p5-empty">No completed reminders yet.</div>';document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>handleReminderAction(b.dataset.action,Number(b.dataset.id),pending.concat(completed))));}
function renderNotifications(data){$('unreadCount').textContent=`(${data.unread_count} unread)`;$('notificationsList').innerHTML=data.notifications.length?data.notifications.map(n=>`<article class="p5-card"><div class="p5-card-top"><strong>${esc(n.title)}</strong><span class="p5-badge">${n.is_read?'Read': 'Unread'}</span></div><p class="p5-muted" style="margin:6px 0">${esc(n.message)}</p><div class="p5-muted">${new Date(n.created_at).toLocaleString('en-IN')}</div><div class="p5-actions">${n.link_url?`<a class="btn btn-sm btn-secondary" href="${esc(n.link_url)}">Open</a>`:''}${n.is_read?'':`<button class="btn btn-sm btn-primary" data-note-read="${n.id}">Mark read</button>`}<button class="btn btn-sm btn-danger" data-note-delete="${n.id}">Delete</button></div></article>`).join(''):'<div class="p5-empty">No notifications.</div>';document.querySelectorAll('[data-note-read]').forEach(b=>b.addEventListener('click',async()=>{try{await API_CLIENT.patch(`/notifications/${b.dataset.noteRead}/read`,{});await refreshAll();}catch(e){err(e.message);}}));document.querySelectorAll('[data-note-delete]').forEach(b=>b.addEventListener('click',async()=>{try{await API_CLIENT.del(`/notifications/${b.dataset.noteDelete}`);await refreshAll();}catch(e){err(e.message);}}));}
function alertItem(icon,title,sub,amount,link){return `<div class="p5-card"><div class="p5-card-top"><div><strong>${icon} ${esc(title)}</strong><div class="p5-muted">${esc(sub)}</div></div>${amount!==null?`<strong>${money(amount)}</strong>`:''}</div>${link?`<div class="p5-actions"><a class="btn btn-sm btn-secondary" href="${link}">View</a></div>`:''}</div>`;}
function renderAlerts(a){const all=[];(a.overdue_fees||[]).forEach(x=>all.push(alertItem('🚨',x.fee_title,`Overdue fee · ${formatDate(x.due_date)}`,x.remaining,'college-fees.html')));(a.fees_due_7_days||[]).forEach(x=>all.push(alertItem('🏫',x.fee_title,`Fee due ${formatDate(x.due_date)}`,x.remaining,'college-fees.html')));(a.fees_due_15_days||[]).forEach(x=>all.push(alertItem('📅',x.fee_title,`Fee due ${formatDate(x.due_date)}`,x.remaining,'college-fees.html')));(a.upcoming_goal_deadlines||[]).forEach(x=>all.push(alertItem('🎯',x.goal_title,`Savings goal deadline ${formatDate(x.target_date)}`,null,'savings-goals.html')));(a.upcoming_scholarship_deadlines||[]).forEach(x=>all.push(alertItem('🎓',x.scholarship_name,`Scholarship deadline ${formatDate(x.application_deadline)}`,null,'scholarships.html')));$('financialAlerts').innerHTML=all.length?all.join(''):'<div class="p5-empty">No urgent financial alerts.</div>';}
function resetForm(){editingId=null;$('reminderForm').reset();$('rDate').value=todayISO();$('formHeading').textContent='＋ Create reminder';$('saveReminderBtn').textContent='Save reminder';$('cancelEditBtn').hidden=true;}
async function handleReminderAction(action,id,all){const r=all.find(x=>x.id===id);try{if(action==='complete'){await API_CLIENT.post(`/user-reminders/${id}/complete`,{});showToast('Reminder completed','success');}else if(action==='delete'){if(!confirm('Delete this reminder?'))return;await API_CLIENT.del(`/user-reminders/${id}`);showToast('Reminder deleted','success');}else if(action==='edit'){editingId=id;$('rTitle').value=r.title;$('rDescription').value=r.description||'';$('rCategory').value=r.category;$('rPriority').value=r.priority;$('rDate').value=r.due_date;$('rTime').value=r.due_time||'';$('rRepeat').value=r.repeat_frequency;$('formHeading').textContent='Edit reminder';$('saveReminderBtn').textContent='Update reminder';$('cancelEditBtn').hidden=false;window.scrollTo({top:0,behavior:'smooth'});return;}await refreshAll();}catch(e){err(e.message);}}
$('reminderForm').addEventListener('submit',async e=>{e.preventDefault();clearErr();const payload={title:$('rTitle').value,description:$('rDescription').value,category:$('rCategory').value,priority:$('rPriority').value,due_date:$('rDate').value,due_time:$('rTime').value||null,repeat_frequency:$('rRepeat').value};try{if(editingId)await API_CLIENT.put(`/user-reminders/${editingId}`,payload);else await API_CLIENT.post('/user-reminders',payload);showToast(editingId?'Reminder updated':'Reminder created','success');resetForm();await refreshAll();}catch(e){err(e.message);}});
$('cancelEditBtn').addEventListener('click',resetForm);$('readAllBtn').addEventListener('click',async()=>{try{await API_CLIENT.patch('/notifications/read-all',{});await refreshAll();}catch(e){err(e.message);}});
init();
</script></body></html>
