<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester Overview — Finlumiq</title>
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:680px){.overview-grid{grid-template-columns:1fr;}}
.fee-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.fee-row:last-child{border-bottom:none;}
</style>
</head>
<body>
<div id="appNav"></div>
<header class="topbar">
  <a class="topbar-brand" href="dashboard.html"><div class="topbar-logo">🎓</div><span class="topbar-title">Finlumiq</span></a>
  <div class="topbar-right">
    <span class="topbar-page-title">Semester Overview</span>
    <button class="theme-toggle-btn">🌙</button>
    <button id="navOpenBtn" class="nav-open-btn">☰</button>
  </div>
</header>

<main class="page-wrap">
  <div class="page-header">
    <div class="page-header-left">
      <h1 id="semTitle">📅 Semester Overview</h1>
      <p id="semMeta"></p>
    </div>
    <a href="semesters.html" class="btn btn-secondary">← Back to Semesters</a>
  </div>

  <!-- Stat Cards -->
  <div class="stat-cards">
    <div class="stat-card"><div class="stat-label">Budget</div><div class="stat-icon">💰</div><div class="stat-value" id="sBudget">₹0</div></div>
    <div class="stat-card danger"><div class="stat-label">Total Expenses</div><div class="stat-icon">💸</div><div class="stat-value" id="sExpenses">₹0</div></div>
    <div class="stat-card success"><div class="stat-label">Budget Remaining</div><div class="stat-icon">🏦</div><div class="stat-value" id="sRemaining">₹0</div></div>
    <div class="stat-card warning"><div class="stat-label">Total Fees</div><div class="stat-icon">🏫</div><div class="stat-value" id="sFees">₹0</div></div>
  </div>

  <!-- Budget Progress -->
  <div class="card mb-24">
    <div class="d-flex" style="justify-content:space-between;margin-bottom:8px;">
      <span class="fw-semi">Budget Used</span>
      <span class="fw-bold" id="budgetPct">0%</span>
    </div>
    <div class="progress-track progress-lg"><div class="progress-fill" id="budgetBar" style="width:0%"></div></div>
  </div>

  <div class="overview-grid">
    <!-- Expenses by Group -->
    <div class="card">
      <div class="section-title">📊 Spending by Group</div>
      <div class="chart-wrap" style="height:240px;"><canvas id="groupChart"></canvas></div>
    </div>

    <!-- Monthly Breakdown -->
    <div class="card">
      <div class="section-title">📅 Monthly Spending</div>
      <div class="chart-wrap" style="height:240px;"><canvas id="monthChart"></canvas></div>
    </div>
  </div>

  <!-- Fees Section -->
  <div class="card mt-24">
    <div class="d-flex align-center gap-8 mb-16" style="justify-content:space-between;">
      <div class="section-title" style="margin-bottom:0;">🏫 Linked Fees</div>
      <div class="d-flex gap-8">
        <span class="text-muted" style="font-size:0.85rem;">Paid: <strong class="text-success" id="feePaid">₹0</strong></span>
        <span class="text-muted" style="font-size:0.85rem;">Pending: <strong class="text-warning" id="feePending">₹0</strong></span>
      </div>
    </div>
    <div id="feesList">
      <div class="text-muted" style="font-size:0.88rem;">No fees linked to this semester.</div>
    </div>
  </div>
</main>

<div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal"><div class="modal-body" style="text-align:center;padding:32px 24px;"><div id="confirmTitle" style="font-weight:700;margin-bottom:8px;font-size:1.1rem;"></div><div id="confirmBody" style="color:var(--muted);"></div></div>
  <div class="modal-footer"><button id="confirmNo" class="btn btn-secondary">Cancel</button><button id="confirmYes" class="btn btn-danger">Confirm</button></div></div>
</div>

<script src="js/common.js"></script>
<script src="js/nav.js"></script>
<script>
initTheme();
let groupChartI=null, monthChartI=null;

async function init(){
  const user=await requireAuth();
  buildNav('semesters',user);
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  if(!id){location.replace('semesters.html');return;}
  try{
    const data=await API_CLIENT.get('/semesters/'+id+'/overview');
    renderPage(data);
  }catch(e){
    showToast('Failed to load semester: '+e.message,'error');
    setTimeout(()=>location.replace('semesters.html'),2000);
  }
}

function renderPage(data){
  const sem=data.semester;
  document.title=sem.semester_name+' — Finlumiq';
  document.getElementById('semTitle').textContent='📅 '+sem.semester_name;
  document.getElementById('semMeta').textContent=
    'Semester '+sem.semester_number+' · '+sem.academic_year+' · '+
    formatDate(sem.start_date)+' → '+formatDate(sem.end_date);

  // Stats
  document.getElementById('sBudget').textContent=money(sem.budget);
  document.getElementById('sExpenses').textContent=money(data.total_expenses);
  document.getElementById('sRemaining').textContent=money(data.remaining_budget);
  document.getElementById('sFees').textContent=money(data.total_fees||0);

  // Budget bar
  const pct=data.budget_used_pct||0;
  const bar=document.getElementById('budgetBar');
  bar.style.width=Math.min(pct,100)+'%';
  bar.className='progress-fill '+(pct>=100?'danger':pct>=80?'warning':'success');
  document.getElementById('budgetPct').textContent=pct+'%';

  // Group chart
  const grps=data.expenses_by_group||{};
  const grpLabels=Object.keys(grps);
  const grpVals=grpLabels.map(l=>grps[l]);
  const colors=['#6366f1','#8b5cf6','#06b6d4','#22c55e','#f59e0b','#ef4444','#ec4899','#14b8a6','#f97316'];
  const ctx1=document.getElementById('groupChart').getContext('2d');
  if(groupChartI) groupChartI.destroy();
  if(grpLabels.length){
    groupChartI=new Chart(ctx1,{type:'doughnut',data:{labels:grpLabels,datasets:[{data:grpVals,backgroundColor:colors.slice(0,grpLabels.length),borderWidth:2,borderColor:'var(--surface)'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:8,font:{size:11},color:'#64748b'}}}}});
  } else {
    document.getElementById('groupChart').parentElement.innerHTML='<div class="empty-state" style="padding:40px;"><div class="empty-icon">📊</div><p>No expenses in this semester</p></div>';
  }

  // Monthly chart
  const monthly=data.monthly_expenses||{};
  const mLabels=Object.keys(monthly).sort();
  const mVals=mLabels.map(l=>monthly[l]);
  const ctx2=document.getElementById('monthChart').getContext('2d');
  if(monthChartI) monthChartI.destroy();
  if(mLabels.length){
    monthChartI=new Chart(ctx2,{type:'bar',data:{labels:mLabels,datasets:[{label:'Expenses',data:mVals,backgroundColor:'rgba(99,102,241,0.7)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#64748b',font:{size:11}}},y:{beginAtZero:true,ticks:{color:'#64748b',font:{size:11},callback:v=>'₹'+Number(v).toLocaleString('en-IN')}}}}});
  }

  // Fees
  const fees=data.fees||[];
  document.getElementById('feePaid').textContent=money(data.total_paid_fees||0);
  document.getElementById('feePending').textContent=money(data.pending_fees||0);
  if(fees.length){
    const STATUS_BADGE={Paid:'badge-success','Partially Paid':'badge-warning',Overdue:'badge-danger',Pending:'badge-muted'};
    document.getElementById('feesList').innerHTML=fees.map(f=>`
      <div class="fee-row">
        <div style="flex:1;min-width:0;">
          <div class="fw-semi" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(f.fee_title)}</div>
          <div class="text-muted" style="font-size:0.78rem;">${f.fee_category} · Due ${formatDate(f.due_date)}</div>
        </div>
        <span class="badge ${STATUS_BADGE[f.status]||'badge-muted'}">${f.status}</span>
        <div style="text-align:right;min-width:80px;">
          <div class="fw-bold" style="font-size:0.9rem;">${money(f.total_amount)}</div>
          <div class="text-muted" style="font-size:0.75rem;">${money(f.paid)} paid</div>
        </div>
      </div>`).join('');
  }
}

init();
</script>
</body>
</html>
