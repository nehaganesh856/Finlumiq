<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarships — Finlumiq</title>
<link rel="stylesheet" href="css/app.css">
<style>
.schol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.schol-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:box-shadow var(--transition),transform var(--transition);}
.schol-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
</style>
</head>
<body>
<div id="appNav"></div>
<header class="topbar">
  <a class="topbar-brand" href="dashboard.html"><div class="topbar-logo">🎓</div><span class="topbar-title">Finlumiq</span></a>
  <div class="topbar-right">
    <span class="topbar-page-title">Scholarships</span>
    <button class="theme-toggle-btn">🌙</button>
    <button id="navOpenBtn" class="nav-open-btn">☰</button>
  </div>
</header>

<main class="page-wrap">
  <div class="page-header">
    <div class="page-header-left"><h1>🎓 Scholarships</h1><p>Track all your scholarship applications and payments.</p></div>
    <button class="btn btn-primary" id="addScholBtn">+ Add Scholarship</button>
  </div>

  <div class="stat-cards">
    <div class="stat-card"><div class="stat-label">Total</div><div class="stat-icon">🎓</div><div class="stat-value" id="sTotal">0</div></div>
    <div class="stat-card success"><div class="stat-label">Awarded</div><div class="stat-icon">💰</div><div class="stat-value" id="sAwarded">₹0</div></div>
    <div class="stat-card warning"><div class="stat-label">Pending</div><div class="stat-icon">⏳</div><div class="stat-value" id="sPending">0</div></div>
    <div class="stat-card danger"><div class="stat-label">Rejected</div><div class="stat-icon">❌</div><div class="stat-value" id="sRejected">0</div></div>
  </div>

  <div class="tabs-bar mb-24" id="statusTabs" style="flex-wrap:wrap;">
    <button class="tab-btn active" data-status="">All</button>
    <button class="tab-btn" data-status="Not Applied">Not Applied</button>
    <button class="tab-btn" data-status="Applied">Applied</button>
    <button class="tab-btn" data-status="Approved">Approved</button>
    <button class="tab-btn" data-status="Received">Received</button>
    <button class="tab-btn" data-status="Rejected">Rejected</button>
  </div>

  <div class="schol-grid" id="scholGrid">
    <div class="loading-state" style="grid-column:1/-1;"><div class="spinner"></div><span>Loading…</span></div>
  </div>
</main>

<!-- Add/Edit Modal -->
<div id="scholModal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header"><span class="modal-title" id="scholModalTitle">Add Scholarship</span><button class="modal-close" id="scholModalClose">✕</button></div>
    <div class="modal-body">
      <form id="scholForm" novalidate>
        <input type="hidden" id="scholId">
        <div class="form-grid form-grid-2" style="gap:14px;">
          <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Scholarship Name *</label><input id="scholName" type="text" class="form-control" placeholder="e.g. National Merit Scholarship" required></div>
          <div class="form-group"><label class="form-label">Provider / Organization</label><input id="scholProvider" type="text" class="form-control" placeholder="e.g. Ministry of Education"></div>
          <div class="form-group"><label class="form-label">Category</label><input id="scholCat" type="text" class="form-control" placeholder="e.g. Merit, Need-based…"></div>
          <div class="form-group"><label class="form-label">Status</label>
            <select id="scholStatus" class="form-control">
              <option>Not Applied</option><option>Applied</option><option>Under Review</option>
              <option>Approved</option><option>Rejected</option><option>Payment Pending</option>
              <option>Partially Received</option><option>Received</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label">Reference Number</label><input id="scholRef" type="text" class="form-control" placeholder="Application ID or ref no."></div>
          <div class="form-group"><label class="form-label">Expected Amount (₹)</label><input id="scholExpAmt" type="number" class="form-control" placeholder="0.00" min="0"></div>
          <div class="form-group"><label class="form-label">Awarded Amount (₹)</label><input id="scholAwdAmt" type="number" class="form-control" placeholder="0.00" min="0"></div>
          <div class="form-group"><label class="form-label">Application Date</label><input id="scholAppDate" type="date" class="form-control"></div>
          <div class="form-group"><label class="form-label">Application Deadline</label><input id="scholDeadline" type="date" class="form-control"></div>
          <div class="form-group"><label class="form-label">Expected Payment Date</label><input id="scholPayDate" type="date" class="form-control"></div>
          <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Notes</label><textarea id="scholDesc" class="form-control" rows="2" placeholder="Additional notes…"></textarea></div>
        </div>
        <div id="scholErr" class="auth-message error mt-8" hidden></div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="scholCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="scholSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Record Receipt Modal -->
<div id="rcptModal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header"><span class="modal-title" id="rcptTitle">Record Receipt</span><button class="modal-close" id="rcptModalClose">✕</button></div>
    <div class="modal-body">
      <form id="rcptForm" novalidate>
        <input type="hidden" id="rcptScholId">
        <div class="form-grid form-grid-2" style="gap:14px;">
          <div class="form-group"><label class="form-label">Amount Received (₹) *</label><input id="rcptAmount" type="number" class="form-control" placeholder="0.00" min="0.01" required></div>
          <div class="form-group"><label class="form-label">Date Received *</label><input id="rcptDate" type="date" class="form-control" required></div>
          <div class="form-group"><label class="form-label">Transaction Reference</label><input id="rcptRef" type="text" class="form-control" placeholder="Optional"></div>
          <div class="form-group"><label class="form-label">Remarks</label><input id="rcptRemarks" type="text" class="form-control" placeholder="Optional"></div>
        </div>
        <div id="rcptErr" class="auth-message error mt-8" hidden></div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="rcptCancelBtn">Cancel</button>
      <button class="btn btn-success" id="rcptSaveBtn">Record Receipt</button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal"><div class="modal-body" style="text-align:center;padding:32px 24px;"><div style="font-size:3rem;margin-bottom:16px;">⚠️</div><div id="confirmTitle" style="font-weight:700;margin-bottom:8px;font-size:1.1rem;"></div><div id="confirmBody" style="color:var(--muted);"></div></div>
  <div class="modal-footer"><button id="confirmNo" class="btn btn-secondary">Cancel</button><button id="confirmYes" class="btn btn-danger">Delete</button></div></div>
</div>

<script src="js/common.js"></script>
<script src="js/nav.js"></script>
<script>
initTheme();
let scholarships=[], activeTab='';

const STATUS_COLORS={
  'Not Applied':'badge-muted','Applied':'badge-primary','Under Review':'badge-warning',
  'Approved':'badge-success','Rejected':'badge-danger','Payment Pending':'badge-warning',
  'Partially Received':'badge-info','Received':'badge-success'
};

async function init(){
  const user=await requireAuth(); buildNav('scholarships',user);
  document.getElementById('rcptDate').value=todayISO();
  loadScholarships();
}

async function loadScholarships(){
  try{scholarships=await API_CLIENT.get('/scholarships');renderGrid();renderStats();}
  catch(e){showToast(e.message,'error');}
}

function getFiltered(){return activeTab?scholarships.filter(s=>s.status===activeTab):scholarships;}

function renderStats(){
  const data=scholarships;
  document.getElementById('sTotal').textContent=data.length;
  document.getElementById('sAwarded').textContent=money(data.reduce((s,x)=>s+(parseFloat(x.awarded_amount)||0),0));
  document.getElementById('sPending').textContent=data.filter(x=>['Applied','Under Review'].includes(x.status)).length;
  document.getElementById('sRejected').textContent=data.filter(x=>x.status==='Rejected').length;
}

function renderGrid(){
  const data=getFiltered();
  const grid=document.getElementById('scholGrid');
  if(!data.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">🎓</div><h3>No scholarships</h3><p>Add scholarships you have applied or plan to apply for.</p><button class="btn btn-primary" onclick="document.getElementById('addScholBtn').click()">Add Scholarship</button></div>`;
    return;
  }
  grid.innerHTML=data.map(s=>{
    const days=s.application_deadline?daysUntil(s.application_deadline):null;
    const received=parseFloat(s.total_received)||0;
    const awarded=parseFloat(s.awarded_amount)||0;
    return `<div class="schol-card">
      <div class="d-flex align-center gap-8 mb-8" style="justify-content:space-between;">
        <span class="badge ${STATUS_COLORS[s.status]||'badge-muted'}">${s.status}</span>
        ${days!==null&&s.status==='Not Applied'?`<span class="text-muted" style="font-size:0.78rem;">${days<0?'<span class="text-danger">Deadline passed</span>':days===0?'<span class="text-danger">Due today!</span>':'<span class="text-warning">'+days+' days left</span>'}</span>`:''}
      </div>
      <div class="fw-bold mb-4" style="font-size:0.98rem;">${escapeHtml(s.scholarship_name)}</div>
      ${s.provider?`<div class="text-muted" style="font-size:0.8rem;">🏛️ ${escapeHtml(s.provider)}</div>`:''}
      ${s.category?`<span class="chip" style="margin:6px 0;font-size:0.75rem;">${escapeHtml(s.category)}</span>`:''}
      <div class="section-divider" style="margin:12px 0;"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.82rem;">
        ${s.expected_amount?`<div><span class="text-muted">Expected</span><div class="fw-bold">${money(s.expected_amount)}</div></div>`:''}
        ${awarded?`<div><span class="text-muted">Awarded</span><div class="fw-bold text-success">${money(awarded)}</div></div>`:''}
        ${received?`<div><span class="text-muted">Received</span><div class="fw-bold text-success">${money(received)}</div></div>`:''}
        ${s.application_deadline?`<div><span class="text-muted">Deadline</span><div>${formatDate(s.application_deadline)}</div></div>`:''}
      </div>
      ${s.reference_number?`<div class="text-muted mt-8" style="font-size:0.78rem;">Ref: ${escapeHtml(s.reference_number)}</div>`:''}
      <div class="d-flex gap-8 mt-12" style="flex-wrap:wrap;">
        ${['Approved','Payment Pending','Partially Received'].includes(s.status)?`<button class="btn btn-sm btn-success" onclick="openRcpt(${s.id})">💳 Record</button>`:''}
        <button class="btn btn-sm btn-secondary" onclick="openEdit(${s.id})">✏️</button>
        <button class="btn btn-sm btn-danger" onclick="deleteSchol(${s.id},'${escapeHtml(s.scholarship_name)}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function openAdd(){document.getElementById('scholModalTitle').textContent='Add Scholarship';document.getElementById('scholId').value='';document.getElementById('scholForm').reset();document.getElementById('scholErr').hidden=true;document.getElementById('scholModal').classList.add('active');}
function openEdit(id){
  const s=scholarships.find(x=>x.id===id);if(!s)return;
  document.getElementById('scholModalTitle').textContent='Edit Scholarship';
  document.getElementById('scholId').value=id;
  document.getElementById('scholName').value=s.scholarship_name;
  document.getElementById('scholProvider').value=s.provider||'';
  document.getElementById('scholCat').value=s.category||'';
  document.getElementById('scholStatus').value=s.status;
  document.getElementById('scholRef').value=s.reference_number||'';
  document.getElementById('scholExpAmt').value=s.expected_amount||'';
  document.getElementById('scholAwdAmt').value=s.awarded_amount||'';
  document.getElementById('scholAppDate').value=s.application_date||'';
  document.getElementById('scholDeadline').value=s.application_deadline||'';
  document.getElementById('scholPayDate').value=s.expected_payment_date||'';
  document.getElementById('scholDesc').value=s.description||'';
  document.getElementById('scholErr').hidden=true;
  document.getElementById('scholModal').classList.add('active');
}
function closeModal(id){document.getElementById(id).classList.remove('active');}
document.getElementById('addScholBtn').addEventListener('click',openAdd);
document.getElementById('scholModalClose').addEventListener('click',()=>closeModal('scholModal'));
document.getElementById('scholCancelBtn').addEventListener('click',()=>closeModal('scholModal'));

document.getElementById('scholSaveBtn').addEventListener('click',async()=>{
  const id=document.getElementById('scholId').value;
  const payload={
    scholarship_name:document.getElementById('scholName').value.trim(),
    provider:document.getElementById('scholProvider').value.trim()||null,
    category:document.getElementById('scholCat').value.trim()||null,
    status:document.getElementById('scholStatus').value,
    reference_number:document.getElementById('scholRef').value.trim()||null,
    expected_amount:parseFloat(document.getElementById('scholExpAmt').value)||0,
    awarded_amount:parseFloat(document.getElementById('scholAwdAmt').value)||0,
    application_date:document.getElementById('scholAppDate').value||null,
    application_deadline:document.getElementById('scholDeadline').value||null,
    expected_payment_date:document.getElementById('scholPayDate').value||null,
    description:document.getElementById('scholDesc').value.trim()||null
  };
  const errEl=document.getElementById('scholErr');
  if(!payload.scholarship_name){errEl.textContent='Scholarship name is required.';errEl.hidden=false;return;}
  const btn=document.getElementById('scholSaveBtn');btn.disabled=true;btn.textContent='Saving…';
  try{
    if(id) await API_CLIENT.put('/scholarships/'+id,payload);
    else    await API_CLIENT.post('/scholarships',payload);
    showToast(id?'Scholarship updated!':'Scholarship added!','success');
    closeModal('scholModal');loadScholarships();
  }catch(e){errEl.textContent=e.message;errEl.hidden=false;}
  finally{btn.disabled=false;btn.textContent='Save';}
});

function openRcpt(id){
  const s=scholarships.find(x=>x.id===id);if(!s)return;
  document.getElementById('rcptScholId').value=id;
  document.getElementById('rcptTitle').textContent='Record Receipt — '+s.scholarship_name;
  document.getElementById('rcptForm').reset();
  document.getElementById('rcptDate').value=todayISO();
  document.getElementById('rcptErr').hidden=true;
  document.getElementById('rcptModal').classList.add('active');
}
document.getElementById('rcptModalClose').addEventListener('click',()=>closeModal('rcptModal'));
document.getElementById('rcptCancelBtn').addEventListener('click',()=>closeModal('rcptModal'));

document.getElementById('rcptSaveBtn').addEventListener('click',async()=>{
  const scholId=document.getElementById('rcptScholId').value;
  const payload={amount_received:parseFloat(document.getElementById('rcptAmount').value)||0,payment_date:document.getElementById('rcptDate').value,transaction_reference:document.getElementById('rcptRef').value.trim(),remarks:document.getElementById('rcptRemarks').value.trim()};
  const errEl=document.getElementById('rcptErr');
  if(!payload.amount_received||!payload.payment_date){errEl.textContent='Fill required fields.';errEl.hidden=false;return;}
  const btn=document.getElementById('rcptSaveBtn');btn.disabled=true;btn.textContent='Recording…';
  try{await API_CLIENT.post('/scholarships/'+scholId+'/payments',payload);showToast('Receipt recorded!','success');closeModal('rcptModal');loadScholarships();}
  catch(e){errEl.textContent=e.message;errEl.hidden=false;}
  finally{btn.disabled=false;btn.textContent='Record Receipt';}
});

async function deleteSchol(id,name){
  const ok=await confirm2('Delete scholarship "'+name+'"?','Delete Scholarship');
  if(!ok)return;
  try{await API_CLIENT.del('/scholarships/'+id);showToast('Deleted.','success');loadScholarships();}
  catch(e){showToast(e.message,'error');}
}

document.querySelectorAll('#statusTabs .tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#statusTabs .tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');activeTab=btn.dataset.status;renderGrid();
  });
});
init();
</script>
</body>
</html>
